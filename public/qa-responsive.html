<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;background:#26292d;color:#fff;font-family:Arial,sans-serif;height:100%;overflow:auto}
.wrap{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px;box-sizing:border-box}
.frame{border:0;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.5)}
</style></head><body><div class="wrap"><iframe id="f" class="frame"></iframe></div><script>
const q=new URLSearchParams(location.search);
const w=Math.max(320,Math.min(1280,+(q.get('w')||430)));
const h=Math.max(480,Math.min(1200,+(q.get('h')||900)));
const section=(q.get('section')||'').replace(/[^a-z0-9-]/gi,'');
const f=document.getElementById('f');
f.style.width=w+'px';f.style.height=h+'px';
f.src='/?responsive-qa=1'+(section?'#'+section:'');
</script></body></html>
